name: Sales production deploy by issue comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: sales-production-issueops
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.number == 2 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/deploy production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Verify exact main SHA and green CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const {GH_TOKEN, REPO, GITHUB_OUTPUT}=process.env;
          if (REPO !== 'milktea-cus/MCP-FBMN') throw Error('Unexpected repo');
          async function api(path) {
            const r=await fetch('https://api.github.com/repos/'+REPO+path,{headers:{Authorization:'Bearer '+GH_TOKEN,Accept:'application/vnd.github+json'}});
            if(!r.ok) throw Error('GitHub API '+r.status);
            return r.json();
          }
          const sha=(await api('/git/ref/heads/main')).object.sha;
          if(!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid SHA');
          const runs=(await api('/actions/workflows/sales-ci.yml/runs?head_sha='+sha+'&event=push&per_page=30')).workflow_runs;
          const latest=runs.filter(r=>r.head_sha===sha && r.head_branch==='main' && r.event==='push').sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];
          if(!latest || latest.status!=='completed' || latest.conclusion!=='success') throw Error('Latest main CI is not green');
          appendFileSync(GITHUB_OUTPUT,'sha='+sha+'\n');
          NODE

  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      API_BASE_URL: https://field-sales-api.milktea-cus.workers.dev
      VERCEL_ORG_ID: team_8KoQUR2ALt0Mc4eywJoz8wjH
      VERCEL_PROJECT_ID: prj_5fNaLxgkk5kYTKXKdY3NOKkFLnXQ
      VERCEL_CLI_VERSION: '65.4.0'
    steps:
      - name: Require production acceptance
        env:
          RELEASE_READY: ${{ vars.SALES_PRODUCTION_READY }}
        run: |
          test "$RELEASE_READY" = "true" || { echo 'Production gates not approved: finish auth, API, database and app acceptance first.'; exit 1; }
          curl --fail --silent --show-error --max-time 20 "$API_BASE_URL/health" >/dev/null
          code=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$API_BASE_URL/api/v1/customers")
          test "$code" = "401" || { echo "Expected unauthenticated API 401, got $code"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build approved Flutter source
        working-directory: apps/sales-mien-tay/apps/sales_flutter
        run: |
          flutter create --platforms=web,android .
          flutter pub get
          python3 scripts/generate_app_icons.py
          python3 scripts/check_app_icons.py
          flutter analyze --no-fatal-infos
          flutter test
          flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Prepare static Vercel Build Output
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sales-release/.vercel/output/static"
          cp -a apps/sales-mien-tay/apps/sales_flutter/build/web/. "$RUNNER_TEMP/sales-release/.vercel/output/static/"
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > "$RUNNER_TEMP/sales-release/.vercel/project.json"
          printf '%s\n' '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/.*","dest":"/index.html"}]}' > "$RUNNER_TEMP/sales-release/.vercel/output/config.json"
          npm install -g "vercel@$VERCEL_CLI_VERSION" --no-audit --no-fund
      - name: Check main has not advanced
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$APPROVED_SHA" || { echo 'main advanced; request deployment again'; exit 1; }
      - name: Deploy production using Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN secret missing'; exit 1; }
          cd "$RUNNER_TEMP/sales-release"
          url=$(vercel deploy --prebuilt --prod --yes)
          DEPLOY_URL="$url" node --input-type=module -e 'const u=new URL(process.env.DEPLOY_URL.trim());if(u.protocol!=="https:"||!u.hostname.endsWith(".vercel.app"))process.exit(1)'
          printf '### Sales production deployment\nURL: %s\nCommit: %s\n' "$url" "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
