name: Sales Miền Tây CI

on:
  pull_request:
    paths:
      - "apps/sales-mien-tay/**"
      - ".github/workflows/sales-ci.yml"
      - ".github/workflows/sales-production-comment.yml"
  push:
    branches: [main]
    paths:
      - "apps/sales-mien-tay/**"
      - ".github/workflows/sales-ci.yml"
      - ".github/workflows/sales-production-comment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-typecheck:
    name: Cloudflare API / Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mien-tay/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Bundle Worker for deployment (no credentials)
        run: npx wrangler deploy --dry-run --minify --outdir .release
      - name: Export verified public Worker bundle for plugin deployment
        if: github.ref == 'refs/heads/main'
        run: |
          node -e "const fs=require('node:fs'),c=require('node:crypto');const b=fs.readFileSync('.release/index.js');const s=b.toString('base64');console.log('P1_BUNDLE_SHA256:'+c.createHash('sha256').update(b).digest('hex'));for(let i=0;i<s.length;i+=12000)console.log('P1_BUNDLE_CHUNK:'+s.slice(i,i+12000));"
      - uses: actions/upload-artifact@v4
        with:
          name: sales-worker-bundle
          path: apps/sales-mien-tay/backend/.release/index.js
          retention-days: 7

  flutter-web:
    name: Flutter / Analyze + Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mien-tay/apps/sales_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing web/android platform scaffolding
        run: flutter create --platforms=web,android .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: sales-mien-tay-web
          path: apps/sales-mien-tay/apps/sales_flutter/build/web
          retention-days: 7

  dependency-and-layout:
    name: Source / Data & secret guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inventory, district data and source restrictions
        run: python3 apps/sales-mien-tay/scripts/verify_source.py
