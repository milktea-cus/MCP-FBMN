name: Sales Miền Tây CI

on:
  pull_request:
    paths:
      - "apps/sales-mien-tay/**"
      - ".github/workflows/sales-ci.yml"
      - ".github/workflows/sales-production-comment.yml"
      - ".github/workflows/sales-android-release.yml"
  push:
    branches: [main]
    paths:
      - "apps/sales-mien-tay/**"
      - ".github/workflows/sales-ci.yml"
      - ".github/workflows/sales-production-comment.yml"
      - ".github/workflows/sales-android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every main push tests the newest source; cancel stale intermediate commits,
# so old Android builds cannot starve the production acceptance run.
concurrency:
  group: sales-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  api-typecheck:
    name: Cloudflare API / Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mien-tay/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Bundle Worker for deployment (no credentials)
        run: npx wrangler deploy --dry-run --minify --outdir .release
      - name: Export verified public Worker bundle for plugin deployment
        if: github.ref == 'refs/heads/main'
        run: |
          node -e "const fs=require('node:fs'),c=require('node:crypto');const b=fs.readFileSync('.release/index.js');const s=b.toString('base64');console.log('P1_BUNDLE_SHA256:'+c.createHash('sha256').update(b).digest('hex'));for(let i=0;i<s.length;i+=12000)console.log('P1_BUNDLE_CHUNK:'+s.slice(i,i+12000));"
      - uses: actions/upload-artifact@v4
        with:
          name: sales-worker-bundle
          path: apps/sales-mien-tay/backend/.release/index.js
          retention-days: 7

  flutter-web:
    name: Flutter / Analyze + Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mien-tay/apps/sales_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing web/android platform scaffolding
        run: flutter create --platforms=web,android .
      - run: flutter pub get
      - name: Generate FB icons for PWA and Android
        run: python3 scripts/generate_app_icons.py
      - name: Validate brand icon sizes
        run: python3 scripts/check_app_icons.py
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Test real Chrome IndexedDB
        run: |
          cp test_browser/offline_browser_test.dart test/offline_browser_test.dart
          flutter test --platform chrome test/offline_browser_test.dart
          rm test/offline_browser_test.dart
      - run: flutter build web --release --pwa-strategy=none --no-web-resources-cdn
      - run: python3 scripts/build_offline_shell.py
      - name: Verify Web Push Service Worker and offline shell
        run: python3 scripts/check_push_shell.py
      - name: Export verified frontend source for production deployment
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import base64,json,subprocess,pathlib,hashlib
          files=[]
          for name in subprocess.check_output(['git','ls-files','-z','--','.']).decode().split('\0'):
              if not name: continue
              p=pathlib.Path(name)
              files.append({'file':'apps/sales-mien-tay/apps/sales_flutter/'+name,'data':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'})
          raw=json.dumps(files,separators=(',',':')).encode(); encoded=base64.b64encode(raw).decode()
          print('P2_SOURCE_SHA256:'+hashlib.sha256(raw).hexdigest())
          for i in range(0,len(encoded),12000): print('P2_SOURCE_CHUNK:'+encoded[i:i+12000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sales-mien-tay-web
          path: apps/sales-mien-tay/apps/sales_flutter/build/web
          retention-days: 7

  dependency-and-layout:
    name: Source / Data & secret guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inventory, district data and source restrictions
        run: python3 apps/sales-mien-tay/scripts/verify_source.py

  flutter-android:
    name: Android / Debug APK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mien-tay/apps/sales_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify checked-in Android platform
        run: |
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/kotlin/com/example/sales_mien_tay/MainActivity.kt
          flutter create --platforms=android .
      - run: flutter pub get
      - name: Generate brand icons
        run: python3 scripts/generate_app_icons.py
      - name: Compile debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: field-work-android-debug
          path: apps/sales-mien-tay/apps/sales_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
