name: Sales Miền Tây CI

on:
  pull_request:
    paths:
      - "apps/sales-mien-tay/**"
      - ".github/workflows/sales-ci.yml"
      - ".github/workflows/sales-production-comment.yml"
      - ".github/workflows/sales-android-release.yml"
      - ".github/workflows/sales-production-smoke.yml"
  push:
    branches: [main]
    paths:
      - "apps/sales-mien-tay/**"
      - ".github/workflows/sales-ci.yml"
      - ".github/workflows/sales-production-comment.yml"
      - ".github/workflows/sales-android-release.yml"
      - ".github/workflows/sales-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every main push still receives all test jobs. School data-only audits and
# application/auth source changes use distinct cancellation groups, so a
# school inventory commit cannot cancel a critical Android release gate.
concurrency:
  group: sales-ci-forms-v4-${{ github.workflow }}-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'data(schools):') && 'school-audit' || (startsWith(github.event.head_commit.message, 'data(hcm):') || startsWith(github.event.head_commit.message, 'docs(hcm):')) && 'hcm-research' || 'app-auth' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  api-typecheck:
    name: Cloudflare API / Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mien-tay/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Verify auth provider transient/invalid status separation
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Bundle Worker for deployment (no credentials)
        run: npx wrangler deploy --dry-run --minify --outdir .release
      - name: Export verified public Worker bundle for plugin deployment
        if: github.ref == 'refs/heads/main'
        run: |
          node -e "const fs=require('node:fs'),c=require('node:crypto');const b=fs.readFileSync('.release/index.js');const s=b.toString('base64');console.log('P1_BUNDLE_SHA256:'+c.createHash('sha256').update(b).digest('hex'));for(let i=0;i<s.length;i+=12000)console.log('P1_BUNDLE_CHUNK:'+s.slice(i,i+12000));"
      - uses: actions/upload-artifact@v4
        with:
          name: sales-worker-bundle
          path: apps/sales-mien-tay/backend/.release/index.js
          retention-days: 7

  flutter-web:
    name: Flutter / Analyze + Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mien-tay/apps/sales_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing web/android platform scaffolding
        run: flutter create --platforms=web,android .
      - run: flutter pub get
      - name: Generate FB icons for PWA and Android
        run: python3 scripts/generate_app_icons.py
      - name: Validate brand icon sizes
        run: python3 scripts/check_app_icons.py
      - run: flutter analyze --no-fatal-infos
      # Regression suite runs in parallel shards below; this job owns the browser/build checks.
      - name: Test real Chrome IndexedDB
        run: |
          cp test_browser/offline_browser_test.dart test/offline_browser_test.dart
          flutter test --platform chrome test/offline_browser_test.dart
          rm test/offline_browser_test.dart
      - run: flutter build web --release --pwa-strategy=none --no-web-resources-cdn
      - run: python3 scripts/build_offline_shell.py
      - name: Verify Web Push Service Worker and offline shell
        run: python3 scripts/check_push_shell.py
      - name: Export verified frontend source for production deployment
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import base64,json,subprocess,pathlib,hashlib
          files=[]
          for name in subprocess.check_output(['git','ls-files','-z','--','.']).decode().split('\0'):
              if not name: continue
              p=pathlib.Path(name)
              files.append({'file':'apps/sales-mien-tay/apps/sales_flutter/'+name,'data':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'})
          raw=json.dumps(files,separators=(',',':')).encode(); encoded=base64.b64encode(raw).decode()
          print('P2_SOURCE_SHA256:'+hashlib.sha256(raw).hexdigest())
          for i in range(0,len(encoded),12000): print('P2_SOURCE_CHUNK:'+encoded[i:i+12000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sales-mien-tay-web
          path: apps/sales-mien-tay/apps/sales_flutter/build/web
          retention-days: 7

  flutter-regression:
    timeout-minutes: 6
    name: Flutter Regression / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: apps/sales-mien-tay/apps/sales_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web,android .
      - run: flutter pub get
      - run: python3 scripts/generate_app_icons.py
      - name: Run all Dart tests, divided into four deterministic shards
        shell: bash
        run: |
          mapfile -t tests < <(find test -maxdepth 1 -name '*_test.dart' | sort)
          group=()
          for i in "${!tests[@]}"; do
            if [[ "${tests[i]}" == "test/template_lifecycle_test.dart" ]]; then continue; fi
            if (( i % 8 == ${{ matrix.shard }} )); then group+=("${tests[i]}"); fi
          done
          if (( ${#group[@]} == 0 )); then echo 'No tests in this shard'; exit 1; fi
          printf 'Running %s test files in shard %s\n' "${#group[@]}" "${{ matrix.shard }}"
          flutter test --concurrency=1 --timeout=75s "${group[@]}"
  flutter-form-lifecycle:
    timeout-minutes: 4
    name: Flutter Form Lifecycle / Isolated
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mien-tay/apps/sales_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web,android .
      - run: flutter pub get
      - name: Validate form API error, recovery and activation in isolated test process
        run: timeout 70s flutter test --reporter expanded --concurrency=1 test/template_lifecycle_test.dart
  dependency-and-layout:
    name: Source / Data & secret guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inventory, district data and source restrictions
        run: python3 apps/sales-mien-tay/scripts/verify_source.py
      - name: Validate one-shot school importer against all 134 old districts
        run: python3 -m unittest discover -s apps/sales-mien-tay/scripts -p 'test_schools_bulk_ingest.py' -v

  flutter-android:
    name: Android / Debug APK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-mien-tay/apps/sales_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify checked-in Android platform
        run: |
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/kotlin/com/example/sales_mien_tay/MainActivity.kt
          flutter create --platforms=android .
      - run: flutter pub get
      - name: Generate and validate brand icons
        run: |
          python3 scripts/generate_app_icons.py
          python3 scripts/check_app_icons.py
      - name: Prefer Maven Central for Flutter Gradle composite build
        # Flutter's included Gradle build may resolve Kotlin from the plugin
        # portal alone; the artifact is published on Maven Central.
        # Apply to included builds as well, without changing release signing.
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/flutter-plugin-repositories.gradle <<'GRADLE'
          gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories {
              mavenCentral()
              google()
              gradlePluginPortal()
            }
          }
          GRADLE
      - name: Compile debug APK
        run: flutter build apk --debug
      - name: Verify compiled APK contains approved launcher icons
        run: python3 scripts/check_apk_icons.py build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: field-work-android-debug
          path: apps/sales-mien-tay/apps/sales_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
