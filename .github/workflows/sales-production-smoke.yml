name: Sales production smoke
on:
  push:
    branches: [main]
    paths: [".github/workflows/sales-production-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Worker database and fail-closed auth
        shell: bash
        run: |
          set -euo pipefail
          base=https://field-sales-api.milktea-cus.workers.dev
          curl --fail --retry 3 --max-time 30 "$base/health" | tee health.json
          jq -e '.status=="ok" and .database=="ok"' health.json
          check() { local expect="$1"; shift; local actual; actual=$(curl -sS -o /dev/null -w '%{http_code}' "$@"); echo "HTTP $actual expected $expect"; test "$actual" = "$expect"; }
          check 401 "$base/api/v1/me"
          check 401 "$base/api/v1/notifications"
          check 401 "$base/api/v1/notifications/config"
          check 401 -H 'Origin: https://sales-mien-tay.vercel.app' -H 'Content-Type: application/json' -d '{}' "$base/api/v1/notifications/test"
          check 401 -H 'Authorization: Bearer fake.invalid.token' "$base/api/v1/me"
          curl -sS --max-time 20 -o /tmp/auth-body -w 'Neon Auth GET session HTTP %{http_code}\n' -H 'Origin: https://sales-mien-tay.vercel.app' 'https://ep-bitter-bar-bd8r5813.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth/get-session?disableCookieCache=true'
          check 401 -H 'Cookie: __Host-sales-session=invalid-session' "$base/api/v1/me"
          check 403 -H 'Origin: https://untrusted.invalid' -H 'Content-Type: application/json' -d '{}' "$base/api/auth/login"
          curl --fail --max-time 30 -H 'Origin: https://sales-mien-tay.vercel.app' -H 'Content-Type: application/json' -d '{"email":"nobody-p1-smoke@example.invalid"}' "$base/api/auth/otp/request" | jq -e '.ok==true'
          echo 'PASS: DB health; anonymous, fake JWT, invalid session, untrusted origin; OTP allowlist'

  frontend_proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify frontend loads and same-origin API/auth proxy is JSON
        shell: bash
        run: |
          set -euo pipefail
          site=https://sales-mien-tay.vercel.app
          curl --fail --retry 2 --max-time 30 -o /tmp/index.html "$site/"
          grep -qi '<html' /tmp/index.html
          curl --fail --retry 2 --max-time 30 -o /tmp/flutter_bootstrap.js "$site/flutter_bootstrap.js"
          code=$(curl -sS --max-time 30 -o /tmp/me.json -w '%{http_code}' "$site/api/v1/me")
          echo "/api/v1/me => HTTP $code"
          test "$code" = 401
          jq -e '.error | type=="string"' /tmp/me.json
          code=$(curl -sS --max-time 30 -o /tmp/login.json -w '%{http_code}' \
            -H 'Origin: https://sales-mien-tay.vercel.app' -H 'Content-Type: application/json' --data '{}' "$site/api/auth/login")
          echo "/api/auth/login (invalid) => HTTP $code"
          test "$code" = 400
          jq -e '.error | type=="string"' /tmp/login.json
          echo 'PASS: frontend HTML/Flutter bootstrap, JSON auth proxy and unauthenticated 401'
